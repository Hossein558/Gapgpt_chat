services:
  gapgpt-bridge:
    build: .
    container_name: gapgpt-bridge
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - GAPGPT_TOKEN=${GAPGPT_TOKEN}
      - GAPGPT_REFRESH_TOKEN=${GAPGPT_REFRESH_TOKEN}
      - GAPGPT_USERNAME=${GAPGPT_USERNAME}
      - GAPGPT_PASSWORD=${GAPGPT_PASSWORD}
      - BRIDGE_API_KEY=${BRIDGE_API_KEY}
      - PORT=8080
      - HOST=0.0.0.0
